name: LaunchPad CI

on:
  push:
    branches:
      - main
      - feat/platform-preflight

  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

      - name: Check local service specification
        run: python platform/preflight.py platform/examples/service.yaml

      - name: Generate local service manifests
        run: |
          python platform/generator.py platform/examples/service.yaml \
            --output "${{ runner.temp }}/launchpad-demo.yaml"

      - name: Enforce strict policy on test fixture
        run: |
          python platform/preflight.py tests/fixtures/policy-ready.yaml --strict
          python platform/generator.py tests/fixtures/policy-ready.yaml \
            --strict \
            --output "${{ runner.temp }}/launchpad-policy-test.yaml"

      - name: Report configuration benchmark
        run: python platform/benchmark.py platform/examples/service.yaml --json

      - name: Validate observability configuration
        run: |
          docker compose -f observability/compose.yaml config --quiet
          docker run --rm --entrypoint promtool \
            -v "$PWD/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            prom/prometheus:v3.10.0 check config /etc/prometheus/prometheus.yml

      - name: Build Docker image
        run: docker build -t launchpad-demo:${{ github.sha }} .

  terraform-validate:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infrastructure/terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Initialize Terraform
        run: terraform init -backend=false

      - name: Check Terraform formatting
        run: terraform fmt -check

      - name: Validate Terraform
        run: terraform validate
